name: CI — Sovereign Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging_smoke:
        description: "Run staging smoke + pact can-i-deploy"
        required: false
        default: "false"
        type: boolean

jobs:
  # ── 1. Unit test suite ──────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short -x --ignore=tests/pact
        env:
          GATEWAY_API_KEY: ""
          PYTHONPATH: ${{ github.workspace }}

  # ── 2. Generate consumer pact files ────────────────────────────────────────
  pact-consumer:
    name: Pact — generate consumer contracts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pact-python>=1.7.0

      - name: Generate pact files
        run: bash scripts/pact/run.sh consumer
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload pact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/
          retention-days: 14

  # ── 3. Publish pacts to PactFlow (main only) ────────────────────────────────
  pact-publish:
    name: Pact — publish to broker
    runs-on: ubuntu-latest
    needs: pact-consumer
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pact-python>=1.7.0

      - name: Download pact artifacts
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts/

      - name: Publish to PactFlow
        run: bash scripts/pact/run.sh publish
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}

  # ── 4. Verify provider against staging (on demand or main push) ─────────────
  pact-provider:
    name: Pact — verify provider (staging)
    runs-on: ubuntu-latest
    needs: pact-consumer
    if: >
      github.ref == 'refs/heads/main' ||
      github.event.inputs.run_staging_smoke == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pact-python>=1.7.0

      - name: Download pact artifacts
        uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts/

      - name: Verify provider pacts
        run: bash scripts/pact/run.sh provider
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PACT_DIR: pacts
          PYTHONPATH: ${{ github.workspace }}

  # ── 5. Can-I-Deploy gate (on demand or main push) ───────────────────────────
  can-i-deploy:
    name: Pact — can-i-deploy check
    runs-on: ubuntu-latest
    needs: [pact-publish, pact-provider]
    if: >
      github.ref == 'refs/heads/main' ||
      github.event.inputs.run_staging_smoke == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pact-python>=1.7.0

      - name: Can-I-Deploy to production
        run: bash scripts/pact/run.sh can-i-deploy
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
