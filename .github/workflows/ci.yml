name: CI — Sovereign Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kernel:
    name: Kernel tests + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Type check
        run: |
          mypy src/semantics src/isa src/agents src/kernel src/protocol \
            --ignore-missing-imports --no-error-summary || true

      - name: Run kernel tests
        run: |
          pytest \
            tests/test_semantic_word.py \
            tests/test_instruction.py \
            tests/test_agent_state.py \
            tests/test_runtime.py \
            -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
