# ── Architecture decisions (ground truth) ────────────────────────────────────
architecture_decisions:

  dual_gateway_problem: >
    sovereign-core/gateway (port 9000) and GH05T3/backend/gateway_v3 (port 8002)
    BOTH act as gateways. This is a consolidation debt. Current active path is
    GH05T3 (8002). sovereign-core gateway is older and less used.

  orchestration_model: >
    GH05T3 supervisor.py is the actual process orchestrator for 16 services.
    sovereign-core gateway/router.py handles inference routing with EMA latency tracking.
    These two need to be wired: supervisor starts services → gateway routes between them.

  inference_strategy: "Local-only: Ollama (GPU, CUDA) → NPU embed (AMD XDNA) → CPU fallback"

  embedding_stack:
    primary: "BGE-large-en-v1.5 ONNX via AMD VitisAI EP (port 8111) — 1024-dim"
    fallback: "MiniLM-L6-v2 via sentence-transformers (port 8111) — 384-dim"
    client: "npu_embed_client.py — drop-in ChromaDB + LangChain wrapper"

  pipeline_agents: "oracle → forge → nexus (sequential, each sees prior output)"

  dataset_pipeline: >
    Agent runs → economy_bridge logs task completions → economy.db →
    ETL to JSONL → HuggingFace tastytator/sovereign-economy →
    Kaggle/Lightning AI SFT → GGUF merge → Ollama (avery/oracle/forge/codex/nexus-sovereign)

  fine_tuning_framework: "PyTorch Lightning + PEFT (LoRA/QLoRA) + Hugging Face Transformers"

  training_targets:
    - "Kaggle T4 (free, JSONL SFT)"
    - "Lightning AI (CLI configured, not yet tested)"
    - "RunPod RTX 3090 (~$0.40/hr, on-demand only)"

  logging_schema:
    fields: ["task_id", "input", "tools_used", "agent_name", "messages", "feedback"]
    format: "JSONL"
    economy_db: "C:\\Users\\leer4\\Documents\\agent-economy\\data\\economy.db"

  security_note: >
    IBAC daemon (ibac_daemon.py) mounts in sage-engine at port 8098.
    capability_client.py INCORRECTLY hardcodes port 8112 — this is a known bug
    (separate fix task: chip task_7adab9a3). Auto-fallback to local-mode
    token minting prevents visible breakage but network-mode IBAC is non-functional.


# ── Inter-repo connections (actual, not aspirational) ────────────────────────
connections:
  - from: "GH05T3/supervisor"
    to: "agent-economy"
    type: "process management + HTTP"
    detail: "supervisor starts economy-api; economy_bridge.py logs task credits via POST /task/complete"

  - from: "GH05T3/pipeline_backend"
    to: "Ollama:11434"
    type: "HTTP"
    detail: "All pipeline agents (oracle/forge/codex/nexus) call Ollama /api/chat"

  - from: "GH05T3/npu_embed"
    to: "local-ai-mesh"
    type: "HTTP (inbound)"
    detail: "local-ai-mesh model_manager.py routes embed() to npu_embed service (8111) first"

  - from: "sovereign-core/gateway"
    to: "Ollama:11434"
    type: "HTTP"
    detail: "gateway/router.py dispatches inference to Ollama backend via aiohttp"

  - from: "GH05T3/backend"
    to: "sovereign-core/gateway"
    type: "NOT CONNECTED (gap)"
    detail: "These two gateways run independently. Wiring them is consolidation work item."


