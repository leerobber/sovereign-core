# Sovereign ecosystem registry — documentation + /v1/repos probe targets.
# GH05T3 dual runtime: set GH05T3_RUNTIME=wsl (default) or windows.

sovereign_ecosystem:
  sovereign_core:
    role: "Inference gateway and request router"
    port: 8000
    health_path: "/health"

  gh05t3:
    role: "Agent backend, pipeline, and MCP server"
    runtime_default: "wsl"
    runtime_override_env: "GH05T3_RUNTIME"
    gateway_url_env: "GH05T3_GATEWAY_URL"
    ports:
      backend: 8001
      gateway_v3: 8002
      supervisor: 8090
    notes: >
      WSL mesh (default): probe http://localhost:8002 from WSL.
      Windows-native: GH05T3_RUNTIME=windows uses WSL default-gateway IP.
      Never run WSL gh05t3-start AND Windows supervisor on the same ports.

  gh05t3_sovereign:
    role: "Quantized binary/ternary transformer + evolvable genome API (GH05T3-Sovereign repo)"
    port: 8002
    health_path: "/health"
    genome_api_path: "/oss/genome"
    notes: >
      Separate repo/process from gh05t3 above (its own gateway_v3.py, forked
      from gh05t3's), but shares the same GATEWAY_PORT default (8002) --
      set the GATEWAY_PORT env var on one of the two before running both on
      the same host, or the probe below will hit whichever one bound the
      port first. Genome endpoints (register/evaluate/evolve/list/best)
      live under genome_api_path, e.g. GET {base_url}/oss/genome/list.

  agent_economy:
    role: "Agent credit economy"
    port: 8081

  local_ai_mesh:
    role: "Multi-model inference mesh"
    port: 8011