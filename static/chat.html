<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sovereign Core — Chat</title>
<style>
  :root {
    --primary: #00d4ff;
    --secondary: #ff6600;
    --bg: #000814;
    --surface: #001029;
    --surface2: #001a3d;
    --text: #7df9ff;
    --text-dim: #3a6a8a;
    --user-bg: #002244;
    --ai-bg: #001133;
    --border: #00d4ff33;
    --glow: 0 0 20px #00d4ff22;
    --scrollbar: #00d4ff44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--glow);
  }

  .header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .header h1 span.icon { color: var(--secondary); }
  .header h1 span.title { color: var(--primary); }

  .header-controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .model-select {
    background: var(--surface2);
    color: var(--primary);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    outline: none;
  }

  .model-select:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: pulse 2s infinite;
  }

  .status-dot.offline { background: #ff0040; animation: none; }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--primary); }
    50% { opacity: 0.5; box-shadow: 0 0 12px var(--primary); }
  }

  .status-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Chat Area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-track { background: var(--bg); }
  .chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .message {
    max-width: 80%;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: var(--user-bg);
    border: 1px solid var(--border);
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: var(--ai-bg);
    border: 1px solid #ffffff0a;
    border-bottom-left-radius: 4px;
  }

  .message .meta {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 8px;
    display: flex;
    gap: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .message .meta .model-tag {
    color: var(--secondary);
    font-weight: 600;
  }

  .message .meta .route-tag {
    color: var(--primary);
  }

  .message pre {
    background: #000;
    padding: 12px;
    border-radius: 6px;
    margin: 8px 0;
    overflow-x: auto;
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .message code {
    background: #ffffff0a;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 13px;
  }

  .message pre code {
    background: none;
    padding: 0;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    align-self: flex-start;
  }

  .typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: bounce 1.4s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* Input Area */
  .input-area {
    padding: 16px 24px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 160px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 15px #00d4ff15;
  }

  textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    background: var(--primary);
    color: var(--bg);
    border: none;
    width: 48px;
    height: 48px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: #33ddff; box-shadow: 0 0 20px var(--primary); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .send-btn:active { transform: scale(0.95); }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    padding: 6px 24px;
    background: var(--bg);
    border-top: 1px solid #ffffff08;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .stats-bar .stat { display: flex; gap: 6px; align-items: center; }
  .stats-bar .val { color: var(--primary); font-weight: 600; }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    animation: fadeIn 0.6s ease;
  }

  .welcome h2 {
    font-size: 24px;
    color: var(--primary);
    margin-bottom: 8px;
    letter-spacing: 4px;
  }

  .welcome p { font-size: 13px; margin-top: 4px; }

  .welcome .cube {
    font-size: 48px;
    margin-bottom: 20px;
    animation: spin 4s linear infinite;
    display: inline-block;
    color: var(--primary);
  }

  @keyframes spin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .message { max-width: 95%; }
    .header { padding: 10px 16px; }
    .input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span class="icon">◆</span> <span class="title">SOVEREIGN CORE</span></h1>
  <div class="header-controls">
    <select class="model-select" id="modelSelect">
      <option value="auto">AUTO (Router)</option>
      <option value="llama3.2:3b">Llama 3.2 3B (CPU)</option>
      <option value="qwen2.5:7b">Qwen 2.5 7B (GPU)</option>
    </select>
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">CONNECTING</span>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome">
    <div class="cube">◆</div>
    <h2>SOVEREIGN CORE</h2>
    <p>Local AI — Zero Cloud — Full Sovereignty</p>
    <p style="margin-top:12px; color: var(--text-dim);">Llama 3.2 3B on CPU • Qwen 2.5 7B on RTX 5050</p>
    <p style="margin-top:4px; color: var(--text-dim);">Type a message to begin</p>
  </div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="messageInput" placeholder="Send a message..." rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" title="Send">▹</button>
</div>

<div class="stats-bar">
  <div class="stat">MESSAGES <span class="val" id="msgCount">0</span></div>
  <div class="stat">LAST MODEL <span class="val" id="lastModel">—</span></div>
  <div class="stat">LAST LATENCY <span class="val" id="lastLatency">—</span></div>
  <div class="stat">ROUTING <span class="val" id="lastRouting">—</span></div>
</div>

<script>
const API_BASE = window.location.origin;
const chatContainer = document.getElementById('chatContainer');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const modelSelect = document.getElementById('modelSelect');
const statusDot = document.getElementById('statusDot');
const statusLabel = document.getElementById('statusLabel');
const msgCount = document.getElementById('msgCount');
const lastModel = document.getElementById('lastModel');
const lastLatency = document.getElementById('lastLatency');
const lastRouting = document.getElementById('lastRouting');

let messages = [];
let sending = false;
let totalMessages = 0;
let welcomeVisible = true;

// Auto-resize textarea
messageInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
});

// Enter to send (Shift+Enter for newline)
messageInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

// Health check
async function checkHealth() {
  try {
    const resp = await fetch(API_BASE + '/health');
    const data = await resp.json();
    if (data.status === 'healthy') {
      statusDot.className = 'status-dot';
      statusLabel.textContent = 'ONLINE';
    } else {
      statusDot.className = 'status-dot offline';
      statusLabel.textContent = 'DEGRADED';
    }
  } catch {
    statusDot.className = 'status-dot offline';
    statusLabel.textContent = 'OFFLINE';
  }
}

function removeWelcome() {
  if (welcomeVisible) {
    const w = chatContainer.querySelector('.welcome');
    if (w) w.remove();
    welcomeVisible = false;
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatContent(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
    return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
  });
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Newlines
  text = text.replace(/\n/g, '<br>');
  return text;
}

function addMessage(role, content, meta = {}) {
  removeWelcome();
  const div = document.createElement('div');
  div.className = 'message ' + role;

  let html = formatContent(content);

  if (role === 'assistant' && (meta.model || meta.latency)) {
    html += '<div class="meta">';
    if (meta.model) html += '<span class="model-tag">' + meta.model + '</span>';
    if (meta.complexity) html += '<span class="route-tag">' + meta.complexity.toUpperCase() + '</span>';
    if (meta.latency) html += '<span>' + meta.latency + '</span>';
    if (meta.tokens) html += '<span>' + meta.tokens + ' tokens</span>';
    html += '</div>';
  }

  div.innerHTML = html;
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = messageInput.value.trim();
  if (!text || sending) return;

  sending = true;
  sendBtn.disabled = true;
  messageInput.value = '';
  messageInput.style.height = 'auto';

  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  totalMessages++;
  msgCount.textContent = totalMessages;

  showTyping();

  const start = performance.now();

  try {
    const body = { messages: messages };
    const selected = modelSelect.value;
    if (selected !== 'auto') {
      body.model = selected;
    }

    const resp = await fetch(API_BASE + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await resp.json();
    hideTyping();

    if (data.choices && data.choices.length > 0) {
      const content = data.choices[0].message.content;
      const routing = data.routing || {};
      const elapsed = ((performance.now() - start) / 1000).toFixed(1);
      const tokens = data.usage ? data.usage.total_tokens : 0;

      messages.push({ role: 'assistant', content: content });
      totalMessages++;
      msgCount.textContent = totalMessages;

      addMessage('assistant', content, {
        model: data.model || routing.model_name || '?',
        complexity: routing.complexity || '',
        latency: elapsed + 's',
        tokens: tokens,
      });

      lastModel.textContent = data.model || routing.model_name || '?';
      lastLatency.textContent = elapsed + 's';
      lastRouting.textContent = (routing.complexity || '?').toUpperCase();
    } else if (data.detail) {
      hideTyping();
      addMessage('assistant', 'Error: ' + data.detail);
    }
  } catch (err) {
    hideTyping();
    addMessage('assistant', 'Connection error: ' + err.message);
  }

  sending = false;
  sendBtn.disabled = false;
  messageInput.focus();
}

// Init
checkHealth();
setInterval(checkHealth, 10000);
messageInput.focus();
</script>
</body>
</html>
