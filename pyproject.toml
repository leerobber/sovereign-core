[project]
name = "sovereign-core"
version = "1.0.0"
description = "Local AI inference gateway with intelligent routing"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "aiohttp>=3.10.0",
  "aiosqlite>=0.20.0",
  "pyyaml>=6.0.0",
  "psutil>=6.0.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
