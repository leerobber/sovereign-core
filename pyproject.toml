[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-core"
version = "0.2.0"
description = "Sovereign AIOS kernel — binary semantics, S-ISA, agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "mypy>=1.10.0",
]
gateway = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiohttp>=3.9.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "gateway*", "contentaios*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
